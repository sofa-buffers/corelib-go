name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job below carries a timeout-minutes. A wedged step must fail fast and
  # say which job it was: the account's Actions concurrency is 20 slots, and a
  # job left to GitHub's 360-minute default holds one of them for six hours
  # while everyone else queues. The values are ~4x the observed runtime.

  lint:
    # gofmt and go vet used to run once per matrix leg. They are version-
    # independent style/soundness checks, so they run once here, on stable, and
    # gate the rest of the workflow: a formatting slip now fails in ~30 s
    # instead of after every build-and-test leg has paid for a full run.
    name: lint (gofmt, vet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Verify formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  build-test:
    name: build & test (Go ${{ matrix.go }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (matches go.mod) plus the current stable release.
        go: ['1.21', 'stable']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

  no-strict-utf8:
    # CORELIB_PLAN §6.4 lets a footprint profile "compile the check out
    # entirely", and the README documents `-tags sofab_no_strict_utf8` as
    # exactly that build. A documented build that is never compiled rots: this
    # leg keeps it building, and keeps its own contract green — the validator is
    # really folded away, and the wire bytes still survive verbatim.
    #
    # It does NOT replace the matrix above. §6.4 is normative that "the target's
    # CI MUST still build and conformance-test the check-ON configuration", so
    # the default build stays the one the shared vectors and the differential
    # fuzzer run in; this is one extra leg beside it, never a substitute.
    name: build & test (-tags sofab_no_strict_utf8)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet -tags sofab_no_strict_utf8 ./...

      - name: Build
        run: go build -tags sofab_no_strict_utf8 ./...

      - name: Test (race)
        run: go test -race -tags sofab_no_strict_utf8 ./...

  coverage:
    name: Coverage
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to publish the generated badge to the `badges` branch
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Generate coverage profile
        # Every package, not just the library: measuring `.` alone left the
        # perfbench command (the §10 bench/perf harness) out of the profile, so
        # it could rot untested while the badge stayed high.
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Compute coverage badge data
        id: cov
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          int=${pct%.*}
          if   [ "$int" -ge 90 ]; then color=brightgreen
          elif [ "$int" -ge 75 ]; then color=green
          elif [ "$int" -ge 50 ]; then color=yellow
          else color=red; fi
          echo "Coverage: ${pct}% (${color})"
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$pct" "$color" > badge/coverage.json

      - name: Publish badge to the badges branch
        # Only from CI runs on main itself: PRs (ref refs/pull/*/merge) and runs
        # on any other branch must not move the published badge.
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge
          publish_branch: badges
          force_orphan: true
          commit_message: "chore(badge): update coverage to ${{ steps.cov.outputs.pct }}"
